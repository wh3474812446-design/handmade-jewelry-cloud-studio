<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云工作室 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --frame: #f2f2f0;
  --surface: #ffffff;
  --raised: #f6f6f5;
  --active: #e8e8e6;
  --border: #e8eaec;
  --rule: #f0f1f2;
  --control: #cdced1;
  --text: #131416;
  --muted: #5d5f60;
  --faint: #6b6b6b;
  --primary: #1d1f20;
  --accent: #1b6c80;
  --accent-soft: #e6f0f2;
  --positive: #1e7b4f;
  --negative: #c4242a;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e;
  --pill-neutral-bg: #ebedee; --pill-neutral-ink: #353736;
  --radius-card: 8px; --radius-control: 6px; --radius-sheet: 16px;
  --sheet-inset: 8px; --sidebar: 228px; --topbar: 48px;
  --gap: 24px; --pad: 24px; --control-h: 32px;
  --fs-title: 22px; --fs-section: 16px; --fs-kpi: 28px; --fs-body: 14px; --fs-small: 12px;
  --font: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: var(--fs-body); line-height: 20px;
  color: var(--text); background: var(--frame);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 18px; }
.hide { display: none !important; }

/* Shell: tinted L-frame + white sheet. 228 + 1204 + 8 = 1440 */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--topbar) 1fr; height: 100vh; }
.sidebar { grid-row: 1 / 3; display: flex; flex-direction: column; padding: 12px 10px 16px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; margin-bottom: 14px; font-weight: 600; font-size: 15px; }
.brand svg { flex: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border: 0; background: none; border-radius: var(--radius-control); color: #45474a; text-align: left; width: 100%;
  transition: background-color .15s var(--ease);
}
.nav-item:hover { background: #e9e9e7; }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.nav-group { margin: 22px 10px 8px; font-size: 12px; color: var(--muted); }
.side-foot { margin-top: auto; padding: 0 8px; display: grid; gap: 14px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 0; }
.search { margin: 0 auto; width: min(548px, 50vw); height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-control); color: var(--faint); }
.search input { border: 0; outline: 0; flex: 1; background: none; min-width: 0; }
.sheet {
  min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sheet);
  margin: 0 var(--sheet-inset) var(--sheet-inset) 0; overflow: auto; position: relative;
}
.page { padding: var(--pad); max-width: 1320px; }

/* Controls */
.btn {
  height: var(--control-h); padding: 0 14px; border-radius: var(--radius-control);
  border: 1px solid var(--control); background: var(--surface); display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .1s;
}
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #393c3e; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--raised); }
.btn.danger { color: var(--negative); border-color: #e9c4c4; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 15px; }
.btn:disabled { background: var(--raised); border-color: var(--border); color: var(--faint); cursor: not-allowed; transform: none; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: var(--radius-control); color: #45474a; }
.icon-btn:hover { background: #e9e9e7; }
.seg { display: inline-flex; background: var(--raised); border-radius: var(--radius-control); padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: none; border-radius: 4px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; outline: 1px solid var(--border); outline-offset: -1px; }
.field { display: grid; gap: 8px; }
.field > span { font-weight: 500; }
.input { height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); width: 100%; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; flex: none; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }
.pill.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.pill.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.pill.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
.pill.accent { background: var(--accent-soft); color: #0f4553; }
.card { border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }
.notice { padding: 10px 12px; border-radius: var(--radius-card); background: var(--pill-warning-bg); border: 1px solid #fde68a; color: var(--pill-warning-ink); font-size: 13px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.title-row { display: flex; align-items: center; gap: 16px; min-height: 40px; }
.title-row h1 { font-size: var(--fs-title); line-height: 28px; font-weight: 600; }
.title-row .actions { margin-left: auto; display: flex; gap: 8px; }
.subline { margin-top: 4px; color: var(--muted); }
.section-title { font-size: var(--fs-section); font-weight: 600; line-height: 24px; }

/* Quota */
.quota { display: grid; gap: 6px; }
.quota .bar { height: 6px; border-radius: 3px; background: #e3e1da; overflow: hidden; }
.quota .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s var(--ease); }
.quota.low .bar i { background: #a86f0c; }

/* Floating layers: the only things with shadow */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 60; font-size: 13px; }
dialog { border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: 0 16px 48px rgba(0,0,0,.18); color: var(--text); }
dialog::backdrop { background: rgba(19,20,22,.32); }
.dlg-body { padding: 24px; display: grid; gap: 16px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--rule); }
.pop { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; min-width: 240px; }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; background: none; border-radius: 6px; text-align: left; }
.pop button:hover { background: var(--raised); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* 共用：图像 */
svg.pic { display: block; width: 100%; height: auto; }
svg.strip { height: auto; max-height: 14px; width: auto; max-width: 100%; display: block; }
.bead-row > svg.strip { min-width: 0; }
.mini-thumb { width: 24px; height: 24px; border-radius: 4px; overflow: hidden; flex: none; border: 1px solid var(--border); display: inline-block; }
.mini-thumb.lg { width: 48px; height: 48px; border-radius: 6px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--active); display: inline-grid; place-items: center; font-size: 12px; }
.account { display: flex; align-items: center; gap: 8px; }
.link { border: 0; background: none; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); font-size: 13px; }
.link:hover { text-decoration-color: var(--text); }
.link:disabled { color: var(--faint); text-decoration: none; cursor: not-allowed; }
.empty-line { margin-top: 24px; padding: 12px 16px; border: 1px dashed var(--control); border-radius: 8px; color: var(--muted); }
.phone-only { display: none; }
.agent-btn { margin-left: 0; }

/* 首页：首次使用 */
.first-run { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--gap); align-items: start; }
.drop-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.drop { aspect-ratio: 1; border: 1.5px dashed #d9dadc; border-radius: var(--radius-card); background: var(--raised); display: grid; place-content: center; justify-items: center; gap: 6px; padding: 16px; text-align: center; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
.drop:hover:not(:disabled) { border-color: var(--text); background: #f1f0ec; }
.drop:disabled { cursor: not-allowed; opacity: .7; }
.drop-guide svg { width: 120px; }
.drop-label { font-weight: 500; font-size: 15px; }
.drop.filled { border: 1px solid var(--border); padding: 0; background: none; margin: 0; overflow: hidden; display: block; aspect-ratio: auto; }
.field .seg { width: fit-content; }
.drop.filled figcaption { display: flex; justify-content: space-between; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.first-run-side { background: var(--raised); border-radius: var(--radius-card); padding: 20px; display: grid; gap: 14px; }
.path { margin: 0; padding-left: 20px; display: grid; gap: 12px; }
.path li::marker { color: var(--accent); font-weight: 600; }
.path b { display: block; font-weight: 600; }
.path span { color: var(--muted); }

/* 首页：工作室列表 */
.waiting { margin-top: 20px; display: grid; gap: 8px; }
.waiting-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: var(--radius-card); }
.waiting-item .btn { margin-left: auto; }
.waiting-item .mini-thumb { width: 36px; height: 36px; }
.studio-list { margin-top: 24px; display: grid; gap: 16px; }
.studio-row { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-card); }
.studio-scenes { display: grid; grid-template-columns: 172px 54px; grid-template-rows: repeat(3, 54px); gap: 4px; width: 230px; border: 0; padding: 0; background: none; border-radius: 6px; overflow: hidden; height: 172px; }
.studio-scenes svg { height: 100%; width: 100%; object-fit: cover; }
.studio-scenes svg:first-child { grid-row: 1 / 4; }
.studio-scenes svg:nth-child(n+2) { height: 100%; }
.studio-meta { display: grid; gap: 8px; }
.studio-meta a { color: inherit; text-decoration: none; }
.studio-meta a:hover { text-decoration: underline; text-underline-offset: 3px; }
.who { display: flex; align-items: center; gap: 8px; }
.model-thumb { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; }
.studio-pieces { display: grid; gap: 8px; }
.piece-chips, .piece-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.piece-chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.piece-chip svg { width: 30px; height: 30px; border-radius: 4px; }
.piece-chip:hover { border-color: var(--control); }
.piece-chip[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); outline-offset: -2px; }

/* 上新：builder */
.builder { display: grid; grid-template-rows: 52px 1fr; min-height: 100%; }
.builder-bar { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
.builder-bar h1 { font-size: 16px; font-weight: 600; }
.builder-body { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.builder-side { padding: 20px 16px; border-right: 1px solid var(--rule); display: grid; align-content: start; gap: 20px; }
.side-piece { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
.side-piece svg { border-radius: 6px; border: 1px solid var(--border); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { border-radius: 6px; color: var(--muted); }
.step-jump { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; width: 100%; border: 0; background: none; color: inherit; border-radius: 6px; text-align: left; }
.step-jump:hover:not(:disabled) { background: #e9e9e7; }
.step-jump:disabled { cursor: default; }
.steps li i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--control); margin: 0 3px; }
.steps li.done { color: var(--text); }
.steps li.done svg { color: var(--accent); }
.steps li.now { background: var(--active); color: var(--text); font-weight: 500; }
.steps li.now i { border-color: var(--text); background: var(--text); }
.canvas { padding: 28px 32px 32px; background: var(--surface); }
.step { max-width: 980px; }
.step-title { font-size: 20px; line-height: 28px; font-weight: 600; margin-bottom: 4px; }
.step-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 8px; }
.step-foot > :last-child { margin-left: auto; }
.step-foot > :first-child:not(:last-child) { margin-right: auto; }
.step-foot .btn + .btn { margin-left: 0; }
.size-row { margin-top: 24px; display: grid; grid-template-columns: 200px 200px 1fr; gap: 16px; align-items: end; }
.input-unit { position: relative; display: block; }
.input-unit i { position: absolute; right: 12px; top: 10px; font-style: normal; color: var(--muted); font-size: 12px; }
.tape { margin: 0; display: flex; align-items: center; gap: 10px; }
.tape svg { width: 120px; flex: none; }
.views-compare { margin-top: 20px; display: grid; gap: 12px; }
.vc { display: grid; grid-template-columns: 1fr 32px 1fr; align-items: center; gap: 8px; max-width: 560px; }
.vc figure { margin: 0; display: grid; gap: 6px; }
.vc svg { border-radius: 6px; border: 1px solid var(--border); }
.vc-arrow { text-align: center; color: var(--muted); }
@media (min-width: 1100px) { .views-compare { grid-template-columns: repeat(3, minmax(0, 1fr)); } .vc { grid-template-columns: 1fr 20px 1fr; } }
.bead-check { margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; width: fit-content; }
.pick-grid { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--gap); }
.pick-col { display: grid; gap: 10px; align-content: start; }
.pick-col.new { background: var(--raised); border-radius: var(--radius-card); padding: 20px; justify-items: start; }
.pick-studio { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: left; }
.pick-studio:hover { border-color: var(--text); }
.pick-studio svg { border-radius: 4px; }
.pick-meta { display: grid; gap: 2px; }
.reason { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
.qa { margin-top: 20px; display: grid; gap: 16px; }
.q { border: 0; padding: 0; margin: 0; }
.q legend { font-weight: 500; margin-bottom: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.opt { height: 34px; padding: 0 14px; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); transition: background-color .15s var(--ease); }
.opt:hover { background: var(--raised); }
.opt[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.opt.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.input.other { width: 220px; height: 34px; }
.ref-row { margin-top: 20px; display: flex; align-items: center; gap: 8px; }
.setcard { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); max-width: 760px; }
.setcard section { background: var(--raised); border-radius: var(--radius-card); padding: 16px 20px; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: 56px 1fr; align-items: center; min-height: 36px; border-top: 1px solid #ebeae5; }
.kv:first-of-type { border-top: 0; }
.kv-select { border: 0; background: none; height: 32px; padding: 0 4px; border-radius: 6px; font-weight: 500; }
.kv-select:hover { background: var(--surface); }
.scene-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.scene-cell { margin: 0; display: grid; gap: 6px; transition: opacity .2s var(--ease); }

.scene-cell svg { border-radius: 6px; }
.scene-cell figcaption { display: flex; justify-content: space-between; font-size: 13px; }
.scene-cell.off svg { opacity: .28; }
.model-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.model-tile { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0; overflow: hidden; text-align: left; display: grid; }
.model-tile > span { padding: 8px 10px; display: grid; gap: 2px; }
.model-tile:hover { border-color: var(--control); }
.model-tile[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); outline-offset: -2px; }
.model-make { margin-top: 24px; display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
.model-make .field { flex: 1; min-width: 280px; max-width: 520px; }
.joined { display: flex; }
.joined .input { border-radius: 8px 0 0 8px; }
.joined .btn { height: 38px; border-radius: 0 8px 8px 0; margin-left: -1px; }
.build-preview { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--gap); }
.scene-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.scene-strip svg, .build-model svg { border-radius: 6px; }
.build-model { display: grid; gap: 8px; }
.build-model span { display: grid; }
.howto { margin-top: 32px; display: grid; gap: 4px; }
.howto-row { margin-top: 12px; max-width: 760px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.howto-row figure { margin: 0; display: grid; gap: 6px; }
.howto-row svg { border-radius: 6px; }


/* 成片示例 */
.samples { margin-top: 40px; display: grid; gap: 8px; }
.samples-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.contact.sample-sheet { margin-top: 8px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.sample-mark { position: absolute; left: 6px; top: 6px; font-size: 12px; line-height: 18px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,.88); color: var(--text); }
@media (max-width: 1100px) { .contact.sample-sheet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .contact.sample-sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 工作室 */
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--text); }
.studio-grid { margin-top: 20px; display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: var(--gap); align-items: start; }
.shoot-panel { position: sticky; top: 0; background: var(--raised); border-radius: var(--radius-card); padding: 16px; display: grid; gap: 16px; }
.shoot-panel .seg { width: fit-content; background: var(--active); }
.seg.sub { margin-left: 26px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; width: fit-content; }
.stepper b { min-width: 48px; text-align: center; font-weight: 500; }
.shoot-btn { width: 100%; justify-content: center; }
.sets { display: grid; gap: 32px; }
.set-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.set-like { margin-left: auto; }
.set-like b { color: var(--accent); font-weight: 600; }
.set.older .contact { opacity: .92; }
.contact { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 16px; }

// 饰品绘制：同一份珠序在实拍、三视图、成片中复用（保真的可视化）
const svg = (w, h, body, cls = '') => `<svg class="${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`;

function pendantPath(p, x, y, s) {
  const r = 9 * s;
  if (p.shape === 'drop') return `<path d="M${x} ${y} C ${x + r} ${y + r * 1.2}, ${x + r * .8} ${y + r * 2.4}, ${x} ${y + r * 2.6} C ${x - r * .8} ${y + r * 2.4}, ${x - r} ${y + r * 1.2}, ${x} ${y}Z" fill="${p.color}" stroke="#8d969c" stroke-width="1"/>`;

// 返回饰品主体（不含背景），在 (cx, cy) 处，scale 控制大小
// view: front | side | back；pendantScale 用于演示「吊坠被画大」的保真偏差
function pieceBody(pc, cx, cy, scale = 1, view = 'front', pendantScale = 1) {
  const n = pc.beads.length;
  let out = '';
  if (pc.cat === 'earring') {
    const r = 14 * scale;
    out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#b9bec4" stroke-width="${2.4 * scale}"/>`;
    if (view !== 'side') out += pendantPath({ ...pc.pendant }, cx, cy + r, scale * 1.4 * pendantScale);
    else out += `<rect x="${cx - 3 * scale}" y="${cy + r}" width="${6 * scale}" height="${30 * scale}" rx="${3 * scale}" fill="${pc.pendant.color}"/>`;
    return out;
  }
  const isNeck = pc.cat === 'necklace';
  const sq = view === 'side' ? .32 : view === 'wrist' ? .5 : 1;
  const rx = (isNeck ? 70 : 46) * scale * sq;
  const ry = (isNeck ? 58 : 46) * scale;
  const pts = [];
  if (isNeck) {
    // 珠子沿链条的二次曲线排布，吊坠挂在最低点
    const P0 = [cx - rx * 1.05, cy - ry * .9], P1 = [cx, cy + ry * 1.25], P2 = [cx + rx * 1.05, cy - ry * .9];
    const q = (t, i) => (1 - t) ** 2 * P0[i] + 2 * (1 - t) * t * P1[i] + t * t * P2[i];
    for (let i = 0; i < n; i++) { const t = .1 + .8 * (i / (n - 1)); pts.push([q(t, 0), q(t, 1)]); }
    out += `<path d="M${P0[0]} ${P0[1]} Q ${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]}" fill="none" stroke="#a9aeb3" stroke-width="${1.2 * scale}"/>`;
  } else {
    for (let i = 0; i < n; i++) { const t = Math.PI * 2 * (i / n); pts.push([cx + Math.cos(t) * rx, cy - Math.sin(t) * ry]); }
    out += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#a9aeb3" stroke-width="${1 * scale}"/>`;
  }
  pts.forEach(([x, y], i) => {
    const b = pc.beads[i], r = (b === 'silver' ? 4.2 : 6) * scale;
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${BEAD_COLOR[b]}" stroke="rgba(0,0,0,.18)" stroke-width=".8"/>`;
  });
  if (isNeck && view !== 'back') out += pendantPath(pc.pendant, cx, cy + ry * .175 + 3 * scale, scale * pendantScale);
  if (view === 'back') out += `<rect x="${cx - 5 * scale}" y="${cy - ry * .98}" width="${10 * scale}" height="${6 * scale}" rx="2" fill="#9aa0a6"/>`;
  if (!isNeck && view !== 'side') out += pendantPath(pc.pendant, cx + rx * .72, cy + ry * .62, scale * .8);

}

// 珠序对照：实拍一行、本张一行，逐颗对齐；吊坠大小不一致时用铜绿圈出
function beadCompare(pc, pendantScale = 1) {
  const n = pc.beads.length, gap = Math.min(11, 150 / Math.max(n, 1)), x0 = 30;
  const px = x0 + n * gap + 8, rowY = [9, 27];
  let s = '';

    s += `<text x="0" y="${rowY[r] + 4}" font-size="11" fill="#5d5f60" font-family="IBM Plex Sans, PingFang SC, sans-serif">${label}</text>`;
    pc.beads.forEach((b, i) => { s += `<circle cx="${x0 + i * gap + gap / 2}" cy="${rowY[r]}" r="${b === 'silver' ? 3.4 : 4.6}" fill="${BEAD_COLOR[b]}" stroke="rgba(0,0,0,.28)" stroke-width=".7"/>`; });
    const pr = 5 * (r ? pendantScale : 1);
    s += `<circle cx="${px}" cy="${rowY[r]}" r="${pr}" fill="${pc.pendant.color}" stroke="rgba(0,0,0,.32)" stroke-width=".7"/>`;

  if (pendantScale !== 1) s += `<circle cx="${px}" cy="${rowY[1]}" r="${5 * pendantScale + 3}" fill="none" stroke="#1b6c80" stroke-width="1.6"/>`;
  return svg(px + 18, 36, s, "compare");

// 场景：同一组色场的四个机位；模特：局部特写轮廓，不画五官
const ANGLES = ['主拍摄区', '左侧角度', '右侧角度', '远景氛围'];
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + amt))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function lit(p, light) {
  const k = { cool: [-4, 0, 6], warm: [8, 2, -8], soft: [0, 0, 0] }[light] || [0, 0, 0];
  const t = hex => { const n = parseInt(hex.slice(1), 16); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map((v, i) => Math.max(0, Math.min(255, v + k[i]))).map(v => v.toString(16).padStart(2, '0')).join(''); };
  return { wall: t(p.wall), floor: t(p.floor), prop: t(p.prop), accent: t(p.accent) };
}
// 场景背景（w×h），angle 0..3；variant 让「重新生成」有变化
function sceneBg(sc, angle, w = 240, h = 240) {
  const c = lit(sc.palette, sc.light), v = sc.variant || 0;
  const horizon = [0.62, 0.66, 0.58, 0.72][angle] * h;
  let s = `<rect width="${w}" height="${h}" fill="${c.wall}"/>`;
  if (sc.material === '海边礁石') {
    s += `<rect y="${horizon - h * .14}" width="${w}" height="${h * .14}" fill="${shade(c.accent, 30)}"/>`;
    s += `<path d="M0 ${horizon} Q ${w * .3} ${horizon - 18 - v * 6} ${w * .55} ${horizon - 4} T ${w} ${horizon - 10} V ${h} H0Z" fill="${c.floor}"/>`;
  } else {
    // 窗光：一个平涂的平行四边形
    const wx = [0.56, 0.18, 0.66, 0.4][angle] * w + v * 8;
    s += `<path d="M${wx} ${h * .08} h${w * .26} l${-w * .1} ${horizon - h * .1} h${-w * .26}Z" fill="${shade(c.wall, 12)}"/>`;
    s += `<rect y="${horizon}" width="${w}" height="${h - horizon}" fill="${c.floor}"/>`;
    if (sc.material === '亚麻布') s += `<path d="M0 ${horizon + 10} Q ${w * .5} ${horizon - 6} ${w} ${horizon + 14} V${h} H0Z" fill="${shade(c.floor, 10)}"/>`;
  }

  const px = [0.14, 0.78, 0.1, 0.5][angle] * w, py = horizon;
  if (angle === 3) s += `<rect x="${w * .3}" y="${py - h * .2}" width="${w * .4}" height="${h * .2}" fill="${shade(c.prop, -8)}"/>`;
  s += `<path d="M${px - 9} ${py} q -4 -26 6 -36 q -6 -10 3 -14 h4 q 9 4 3 14 q 10 10 6 36Z" fill="${c.prop}"/>`;
  s += `<path d="M${px + 2} ${py - 50} q 8 -16 18 -20 M${px + 2} ${py - 50} q -6 -14 -2 -24" stroke="${c.accent}" stroke-width="1.6" fill="none"/>`;
  return s;
}
const sceneSvg = (sc, angle) => svg(240, 240, sceneBg(sc, angle), 'pic');

  return svg(120, 90, `<path d="M${60 - rx} 20 Q 60 ${v === 'back' ? 70 : 82} ${60 + rx} 20" fill="none" stroke="#b3b5b8" stroke-width="1.5" stroke-dasharray="3 4"/>${v === 'back' ? '<rect x="55" y="16" width="10" height="6" rx="2" fill="none" stroke="#b3b5b8" stroke-dasharray="2 2"/>' : '<circle cx="60" cy="62" r="6" fill="none" stroke="#b3b5b8" stroke-dasharray="2 2"/>'}`);
}

// 上新：上传 → 三视图 → 复用 / 新建 →（气质 → 设定卡 → 场景 → 模特 → 组建）
const F = { draft: null, answers: {}, other: {}, card: null, scene: null, kept: [true, true, true, true], modelId: null, name: '' };
const STEPS_NEW = [['upload', '三张实拍与尺寸'], ['views', '确认标准三视图'], ['pick', '选工作室'], ['ask', '聊作品气质'], ['card', '确认设定卡'], ['scenes', '生成场景'], ['model', '选模特'], ['build', '组建工作室']];

function Flow() {
  const step = route.step || 'upload';
  const pc = route.pieceId ? byId(S.pieces, route.pieceId) : F.draft;
  const idx = STEPS_NEW.findIndex(s => s[0] === step);
  const steps = STEPS_NEW.map(([k, label], i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}" ${i === idx ? 'aria-current="step"' : ''}><button class="step-jump" ${pc && pc.id ? '' : 'disabled'} onclick="jumpStep('${pc && pc.id}','${k}')">${i < idx ? icon('check', 14) : '<i></i>'}<span>${label}</span></button></li>`).join('');
  const body = { upload: StepUpload, views: StepViews, pick: StepPick, ask: StepAsk, card: StepCard, scenes: StepScenes, model: StepModel, build: StepBuild }[step](pc);
  return `<div class="builder">
    <div class="builder-bar"><button class="icon-btn" aria-label="返回我的工作室" onclick="go('home')">${icon('back')}</button>
      <h1>${pc && pc.name ? esc(pc.name) : '上新一件作品'}</h1>${pc && pc.cat ? `<span class="pill">${CAT[pc.cat]}</span>` : ''}</div>
    <div class="builder-body">
      <aside class="builder-side">
        ${pc && pc.id ? `<div class="side-piece">${stdView(pc, 'front', '#fff')}<div><b>${esc(pc.name)}</b><p class="small muted mono">${SIZE_FIELDS[pc.cat][0][0]} ${pc.sizes[0]} cm</p></div></div>` : ''}
        <ol class="steps">${steps}</ol>${pc && pc.id ? '<p class="small muted">原型演示：可点任一步骤直接查看</p>' : ''}
      </aside>
      <section class="canvas">${body}</section>
    </div></div>`;
}

// 上传：先选品类，再放三张实拍（原型里点击即放入示例照片）
function StepUpload() {
  const d = F.draft || (F.draft = { cat: null, shots: {}, sizes: ['', ''], name: '' });
  const sample = d.cat ? nextSample(d.cat) : null;
  const filled = ['front', 'side', 'back'].filter(v => d.shots[v]).length;
  const fields = d.cat ? SIZE_FIELDS[d.cat] : [];
  const missing = [];
  if (!d.cat) missing.push('品类');
  ['front', 'side', 'back'].forEach(v => { if (!d.shots[v]) missing.push(VIEW_LABEL[v] + '实拍'); });
  if (d.cat && !d.sizes[0]) missing.push(fields[0][0]);
  return `<div class="step">
    <h2 class="step-title">放进三张实拍</h2>
    <p class="muted">饰品只从这三张照片里来。手机随手拍就行，系统会抠图、统一背景。</p>
    <div class="field" style="margin-top:20px"><span>品类</span><div class="seg" role="group" aria-label="品类">
      ${Object.entries(CAT).map(([k, v]) => `<button aria-pressed="${d.cat === k}" onclick="F.draft.cat='${k}';F.draft.shots={};F.draft.sizes=['',''];render()">${v}</button>`).join('')}</div></div>
    <div class="drop-row" style="margin-top:20px">${['front', 'side', 'back'].map(v => d.shots[v] ? `
      <figure class="drop filled">${rawPhoto(sample, v)}<figcaption><span>${VIEW_LABEL[v]} · IMG_${2201 + ['front', 'side', 'back'].indexOf(v)}.jpg</span><button class="link" onclick="delete F.draft.shots['${v}'];render()">换一张</button></figcaption></figure>` : `
      <button class="drop" ${d.cat ? '' : 'disabled'} onclick="F.draft.shots['${v}']=1;render()"><span class="drop-guide">${guide(v)}</span><span class="drop-label">${VIEW_LABEL[v]}实拍</span><span class="small muted">${d.cat ? '拖入或点击选择' : '先选品类'}</span></button>`).join('')}</div>
    <p class="small muted" style="margin-top:8px">JPG / PNG / HEIC / WebP，短边不小于 1000 px，单张不超过 20 MB</p>
    ${d.cat ? `<div class="size-row">
      ${fields.map(([label, req], i) => `<label class="field"><span>${label}${req ? '' : ' <span class="muted small">选填</span>'}</span>
        <span class="input-unit"><input class="input mono" inputmode="decimal" value="${esc(d.sizes[i])}" oninput="F.draft.sizes[${i}]=this.value;refreshUploadHint()" placeholder="${req ? '必填' : ''}"><i>cm</i></span></label>`).join('')}
      <figure class="tape">${svg(160, 70, `<rect x="6" y="26" width="148" height="18" rx="3" fill="#f1e7c7" stroke="#c9b26a"/>${Array.from({ length: 15 }, (_, i) => `<path d="M${12 + i * 10} 26 v${i % 5 ? 6 : 10}" stroke="#8a7a3d"/>`).join('')}<circle cx="40" cy="35" r="14" fill="none" stroke="#9aa0a6" stroke-dasharray="3 3"/>`)}<figcaption class="small muted">软尺贴着饰品量，${fields[0][0]}量整条展开长度</figcaption></figure>
    </div>` : ''}
    <div class="step-foot"><span id="upload-hint" class="small ${missing.length ? 'muted' : ''}">${missing.length ? '还缺：' + missing.join('、') : `已齐：3 张实拍 · ${fields[0] ? fields[0][0] : ''} ${esc(d.sizes[0])} cm`}</span>
      <button class="btn primary" ${missing.length ? 'disabled' : ''} onclick="submitUpload()">整理三视图</button></div>
  </div>`;
}
function refreshUploadHint() { const pos = document.activeElement && document.activeElement.selectionStart; const i = [...document.querySelectorAll('.size-row input')].indexOf(document.activeElement); render(); if (i >= 0) { const el = document.querySelectorAll('.size-row input')[i]; el.focus(); el.setSelectionRange(pos, pos); } }
function nextSample(cat) {
  const used = S.pieces.map(p => p.name);
  return SAMPLE_PIECES.find(p => p.cat === cat && !used.includes(p.name)) || SAMPLE_PIECES.find(p => p.cat === cat);
}
function submitUpload() {
  const d = F.draft, sample = nextSample(d.cat);
  const pc = { ...sample, id: uid('p'), sizes: [d.sizes[0], d.sizes[1] || sample.sizes[1]], confirmed: false, createdAt: new Date() };

}
function StepViews(pc) {
  return `<div class="step">

function reuseStudio(pieceId, studioId) {
  S.matchLog = (S.matchLog || []).concat({ pieceId, path: '复用', reason: F.reason || null });

function startNew(pieceId) {
  S.matchLog = (S.matchLog || []).concat({ pieceId, path: '新建', reason: F.reason || null });
  Object.assign(F, { answers: {}, other: {}, card: null, scene: null, kept: [true, true, true, true], modelId: null, name: '' });
  go('flow', { pieceId, step: 'ask' });
}

// 原型演示：跳到任一步，缺的前置数据用默认值补齐（不扣额度）
function jumpStep(pieceId, step) {
  const order = STEPS_NEW.map(s => s[0]), at = order.indexOf(step);
  if (step === 'upload') { F.draft = null; return go('flow', { step: 'upload' }); }
  if (at >= order.indexOf('card') && !F.card) { QUESTIONS.forEach(q => { F.answers[q.id] = F.answers[q.id] || q.opts[0]; }); makeCard(); }
  if (at >= order.indexOf('scenes') && !F.scene) { const c = F.card; F.scene = { material: c.material, palette: SCENE_PALETTES[c.material], light: LIGHT_SHIFT[c.light], tone: c.tone, atmo: c.atmo, variant: 0, version: 1 }; F.kept = [true, true, true, true]; }
  if (at >= order.indexOf('build') && !F.modelId) F.modelId = 'm1';
  go('flow', { pieceId, step });
}

function pickAns(id, fallback) { const a = F.answers[id]; return a === '其他' ? (F.other[id] || fallback) : a; }

function chatModel() {

  const using = (tab === 'scene' || tab === 'model') ? studiosUsing(tab, id) : [];

    return confirmBox(`「${esc(x.name)}」被 ${using.length} 间工作室使用，暂时不能删除`, `先在这些工作室里换掉它：${using.map(s => esc(s.name)).join('、')}。已有成片不受影响。`, null);
  }
  const selfNote = tab === 'model' && x.source === 'self' ? `原始照片和这位模特会一并删除，之后无法恢复。${using.length ? `正在使用它的 ${using.length} 间工作室会显示「缺模特」，补选之前不能拍。` : ''}` : '已有成片不受影响，拍摄记录保留。';
  confirmBox(`删除「${esc(x.name)}」？`, selfNote, () => {
    S.shots.filter(s => s.modelId === id).forEach(s => { s.modelName = x.name; });
    S[listKey] = S[listKey].filter(y => y.id !== id);
    if (tab === 'model') using.forEach(s => { s.modelId = null; });
    render(); toast('已删除');
  });
}
function confirmBox(title, body, onOk) {
  window._ok = onOk;
  $('#layer').innerHTML = `<dialog id="dlg"><div class="dlg-body"><h2 class="section-title">${title}</h2><p>${body}</p></div>
    <div class="dlg-foot">${onOk ? `<button class="btn" onclick="closeLayer()">取消</button><button class="btn danger" onclick="closeLayer();_ok()">删除</button>` : `<button class="btn primary" onclick="closeLayer()">知道了</button>`}</div></dialog>`;
  $('#dlg').showModal(); $('#dlg').addEventListener('close', closeLayer);
}
function selfModelDialog() {
  $('#layer').innerHTML = `<dialog id="dlg"><div class="dlg-body">
    <h2 class="section-title">用你自己的照片生成模特</h2>
    <p>上传一张你本人的正脸照片，生成只属于你的模特。人脸属于敏感个人信息，需要你单独同意。</p>
    <label class="check"><input type="checkbox" id="c1" onchange="selfOk()"><span>照片是我本人</span></label>
    <label class="check"><input type="checkbox" id="c2" onchange="selfOk()"><span>我单独同意平台使用这张人脸照片生成模特；模特只在我的账号内可用，我可以随时删除，删除后照片与模特一并删除。<span class="muted">【条款文案待定】</span></span></label>
  </div><div class="dlg-foot"><button class="btn" onclick="closeLayer()">取消</button><button class="btn primary" id="selfgo" disabled onclick="makeSelfModel()">上传照片并生成 · 1 张</button></div></dialog>`;
  $('#dlg').showModal(); $('#dlg').addEventListener('close', closeLayer);
}
function selfOk() { $('#selfgo').disabled = !($('#c1').checked && $('#c2').checked); }
function makeSelfModel() {
  if (!spend(1, '本人模特')) return toast('额度不够');
  S.consentLogs.push({ user: S.user.shop, kind: '人脸信息', at: new Date() });
  const m = { id: uid('m'), name: '我（本人）', skin: '#e9c6a9', hair: '#3b2c22', outfit: '#d9dfe2', temper: ['清冷', '温柔', '明亮', '复古'], desc: '本人', source: 'self' };
  S.models.push(m); if (route.name === 'flow') F.modelId = m.id;
  closeLayer(); render(); toast('本人模特已生成，仅你可见');
}

// 谁在用什么：解释为什么有的素材删不掉
function usageMap() {
  if (!S.studios.length) return '';
  return `<section class="usage"><h2 class="section-title">工作室在用的素材</h2>
    <p class="small muted">场景和模特被工作室使用时不能删除；改动共享场景会影响所有用到它的工作室。</p>
    <table class="asset-table"><thead><tr><th>工作室</th><th>场景</th><th>模特</th><th>拍过的作品</th><th class="num">成片</th></tr></thead><tbody>
    ${S.studios.map(st => { const sc = byId(S.scenes, st.sceneId), m = byId(S.models, st.modelId), sh = S.shots.filter(x => x.studioId === st.id && !x.failed);
      const ps = [...new Set(sh.map(x => x.pieceId))].map(id => byId(S.pieces, id).name);
      return `<tr><td><a href="#" onclick="go('studio',{id:'${st.id}'});return false">${esc(st.name)}</a></td><td><span class="row-id"><span class="mini-thumb">${sceneSvg(sc, 0)}</span>${esc(sc.name)} <span class="small muted">v${sc.version}</span></span></td>
        <td>${m ? `<span class="row-id"><span class="mini-thumb">${modelPortrait(m)}</span>${esc(m.name)}</span>` : '<span class="pill neg">缺模特</span>'}</td><td>${ps.map(esc).join('、') || '—'}</td><td class="num">${sh.length}</td></tr>`; }).join('')}
    </tbody></table></section>`;
}

// 外层 Agent（P1）：一句话调用工作流。原型里用关键词路由演示，正式版由模型做意图分类。
const Agent = {
  open: false, msgs: [{ who: 'a', html: '我可以帮你一句话新建或复用工作室，也可以针对某一张做调整。设定卡和保存工作室这两步，我会停下来请你确认。' }],
  toggle() { this.open = !this.open; this.mount(); if (this.open) setTimeout(() => $('#agent-in') && $('#agent-in').focus()); },
  say(html, who = 'a') { this.msgs.push({ who, html }); this.mount(); },
  mount() {
    let el = $('#agent'); if (!el) { el = document.createElement('aside'); el.id = 'agent'; el.setAttribute('aria-label', '助手'); document.body.appendChild(el); }
    el.className = this.open ? 'agent open' : 'agent'; document.body.classList.toggle('agent-on', this.open);
    if (!this.open) { el.innerHTML = ''; return; }
    const tips = ['帮这条项链建一间清冷风的工作室', '用上次那间工作室拍最新的作品', '第 3 张吊坠改小一点', '换成海边再拍一套', '这个场景的光暖一点'];
    el.innerHTML = `<header class="agent-head"><b>助手</b><span class="pill">P1</span><button class="icon-btn" aria-label="关闭助手" onclick="Agent.toggle()">${icon('close')}</button></header>
      <div class="agent-log" id="agent-log">${this.msgs.map(m => `<div class="msg ${m.who}">${m.html}</div>`).join('')}</div>
      <div class="agent-tips">${tips.map(t => `<button class="opt sm" onclick="Agent.run('${t}')">${t}</button>`).join('')}</div>
      <form class="agent-form" onsubmit="event.preventDefault();Agent.run($('#agent-in').value)"><input class="input" id="agent-in" placeholder="说一句你想做什么" autocomplete="off"><button class="btn primary">发送</button></form>
      <details class="adv small"><summary>高级：查看本次提示词</summary><p class="muted">${esc(this.prompt || '还没有调用工作流。')}</p></details>`;
    const log = $('#agent-log'); log.scrollTop = log.scrollHeight;
  },
  run(text) {
    text = (text || '').trim(); if (!text) return;
    this.say(esc(text), 'u'); if ($('#agent-in')) $('#agent-in').value = '';
    const latest = [...S.pieces].reverse().find(p => p.confirmed);
    if (/建/.test(text) && /工作室/.test(text)) return this.create(text, latest);
    if (/用.*(那间|工作室).*拍|复用/.test(text)) return this.reuse(text, latest);
    const n = text.match(/第\s*(\d)\s*张/);
    if (n) return this.fix(+n[1], text);
    if (/换成海边|海边再拍/.test(text)) return this.newScene('海边礁石');
    if (/场景|光/.test(text) && /暖|冷|亮/.test(text)) return this.tweakScene(text);
    this.say('这句我还没读懂。我能做：新建或复用工作室、针对某一张重拍、换场景再拍、调整当前场景。');
  },
  need(latest) { if (latest) return true; this.say(`先把作品的三张实拍放进来，我才能开始。<button class="btn sm-btn" onclick="go('flow',{step:'upload'})">去上传</button>`); return false; },
  create(text, pc) {
    if (!this.need(pc)) return;
    const mood = ['清冷', '温柔', '明亮', '复古'].find(m => text.includes(m)) || '清冷';
    const mat = /海边/.test(text) ? '海边礁石' : /木/.test(text) ? '旧木桌' : /石膏/.test(text) ? '石膏墙' : '亚麻布';
    F.answers = { mood, wear: '日常', light: '清晨窗光', material: mat }; F.other = {}; makeCard();
    this.prompt = `作品「${pc.name}」${CAT[pc.cat]}；气质=${mood}；材质=${mat}；保真：饰品像素与珠序不可改。`;
    const c = F.card;
    this.say(`给「${esc(pc.name)}」整理了设定卡，确认后我再生成场景：
      <div class="mini-card"><p><b>背景</b> ${esc(c.atmo)} · ${esc(c.tone)} · ${esc(c.material)} · ${esc(c.light)}</p><p><b>模特</b> ${esc(c.temper)} · ${esc(c.outfit)} · ${esc(c.pose)}</p></div>
      <div class="msg-act"><button class="btn primary" onclick="Agent.afterCard('${pc.id}')">就这样</button><button class="btn" onclick="go('flow',{pieceId:'${pc.id}',step:'card'});Agent.toggle()">在页面里改</button></div>`);
  },
  afterCard(pieceId) {
    if (!spend(4, 'Agent 生成场景')) return this.say('额度不够生成 4 张场景图。');
    const c = F.card;
    F.scene = { material: c.material, palette: SCENE_PALETTES[c.material], light: LIGHT_SHIFT[c.light], tone: c.tone, atmo: c.atmo, variant: 0, version: 1 };
    F.kept = [true, true, true, true];
    const rec = S.models.find(m => m.source === 'preset' && m.temper.includes(c.mood)); F.modelId = rec.id;
    F.name = c.material.replace('海边', '') + '·' + c.mood;
    this.say(`场景和模特准备好了。要保存为工作室吗？保存后场景和模特会写进总资产。
      <div class="mini-scenes">${ANGLES.map((a, i) => `<button class="mini-scene" aria-pressed="${F.kept[i]}" title="${a}" onclick="F.kept[${i}]=!F.kept[${i}];this.setAttribute('aria-pressed',F.kept[${i}])">${sceneSvg(F.scene, i)}</button>`).join('')}</div>
      <p class="small muted">点图可以去掉不要的机位 · 模特：${esc(rec.name)}（${esc(rec.desc)}）</p>
      <div class="msg-act"><button class="btn primary" onclick="Agent.save('${pieceId}')">保存工作室并拍一套</button><button class="btn" onclick="go('flow',{pieceId:'${pieceId}',step:'model'});Agent.toggle()">换模特</button></div>`);
  },
  save(pieceId) {
    if (!F.kept.some(Boolean)) F.kept[0] = true;
    const st = saveStudio(pieceId, { silent: true }); zs(st, pieceId);
    go('studio', { id: st.id, pieceId }); shoot(st.id);
    this.say(`已保存「${esc(st.name)}」并拍了一套。每张下面有珠序对照，看看哪张不像。`);
  },
  reuse(text, pc) {
    if (!this.need(pc)) return;
    if (!S.studios.length) return this.say('还没有工作室可以复用。要我按气质新建一间吗？');
    const st = S.studios.find(s => text.includes(s.name)) || S.studios[S.studios.length - 1];
    if (!byId(S.models, st.modelId)) return this.say(`「${esc(st.name)}」缺模特，先在工作室里补选一位。`);
    zs(st, pc.id); go('studio', { id: st.id, pieceId: pc.id }); shoot(st.id);
    this.say(`用「${esc(st.name)}」给「${esc(pc.name)}」拍了一套。`);
  },
  fix(n, text) {
    const st = route.name === 'studio' && byId(S.studios, route.id);
    if (!st) return this.say('先进入一间工作室，我才知道是哪一张。');
    const last = S.shots.filter(x => x.studioId === st.id && x.kind === 'ai').map(x => x.setId).pop();
    const x = S.shots.filter(s => s.setId === last && s.kind === 'ai')[n - 1];
    if (!x || x.failed) return this.say(`这一套没有可调整的第 ${n} 张。`);
    this.prompt = `定点重拍：第 ${n} 张；要求：${text}；保真：吊坠尺寸与实拍一致。`;
    retake(x.id, /小|大/.test(text) ? '大小' : '细节');
    this.say(`第 ${n} 张已按「${esc(text)}」重拍，原图保留为历史。吊坠尺寸仍按实拍，不会改小到和实物不符。`);
  },
  newScene(mat) {
    const st = route.name === 'studio' && byId(S.studios, route.id);
    if (!st) return this.say('先进入一间工作室，我再帮你换场景。');
    if (!spend(4, 'Agent 新场景')) return this.say('额度不够生成 4 张场景图。');
    const base = byId(S.scenes, st.sceneId);
    const sc = { id: uid('s'), name: '海边礁石 场景', material: mat, palette: SCENE_PALETTES[mat], light: base.light, tone: SCENE_PALETTES[mat].tone, atmo: '开阔透气', variant: 0, version: 1, kept: [1, 1, 1, 1], versions: [{ v: 1, at: new Date() }] };
    this._pending = sc;
    this.say(`生成了一个海边场景：<div class="mini-scenes">${[0, 1, 2, 3].map(i => `<span class="mini-scene">${sceneSvg(sc, i)}</span>`).join('')}</div>要不要存进总资产，并把「${esc(st.name)}」换成它再拍一套？
      <div class="msg-act"><button class="btn primary" onclick="Agent.useScene('${st.id}')">存进并再拍</button><button class="btn" onclick="Agent.say('好的，不存。')">不用了</button></div>`);
  },
  useScene(studioId) {
    const sc = this._pending; if (!sc) return; S.scenes.push(sc); this._pending = null;
    byId(S.studios, studioId).sceneId = sc.id; render(); shoot(studioId);
    this.say('已存进总资产、切换场景并拍了一套。之前的成片还在下面。');
  },
  tweakScene(text) {
    const st = route.name === 'studio' && byId(S.studios, route.id);
    if (!st) return this.say('先进入一间工作室。');
    const sc = byId(S.scenes, st.sceneId), n = studiosUsing('scene', sc.id).length;
    const light = /暖/.test(text) ? 'warm' : /冷/.test(text) ? 'cool' : 'soft';
    this.say(`把「${esc(sc.name)}」的光调成${light === 'warm' ? '暖光' : light === 'cool' ? '冷光' : '柔光'}，要存进这个场景吗？${n > 1 ? `<b>将影响 ${n} 间工作室。</b>` : ''}已有成片不变。
      <div class="msg-act"><button class="btn primary" onclick="Agent.applyTweak('${sc.id}','${light}')">存进场景</button><button class="btn" onclick="Agent.say('好的，不改。')">不改</button></div>`);
  },
  applyTweak(id, light) {
    const sc = byId(S.scenes, id); sc.light = light; sc.version++; sc.versions.push({ v: sc.version, at: new Date() });
    render(); this.say(`场景已更新到 v${sc.version}，用到它的工作室都会用新版本。`);
  },
};

// 示例账号：一位用过一阵的卖家。全部为演示数据，写进用户资产，额度从记录行计算。
function seedDemo() {
  resetUser(true);
  S.user = { shop: '示例店铺', isNew: false };
  const day = (d, h = 10) => new Date(2026, 9, d, h, 12);
  const piece = (i, extra = {}) => { const p = { ...SAMPLE_PIECES[i], id: uid('p'), confirmed: true, createdAt: day(20 + i), ...extra }; S.pieces.push(p); return p; };
  const wu = piece(0), yue = piece(1), mei = piece(2), chao = piece(3);
  const scene = (name, material, light, atmo, version = 1) => {
    const sc = { id: uid('s'), name, material, palette: SCENE_PALETTES[material], light, tone: SCENE_PALETTES[material].tone, atmo, variant: 0, version, kept: [1, 1, 1, 1], versions: Array.from({ length: version }, (_, i) => ({ v: i + 1, at: day(21 + i) })) };
    S.scenes.push(sc); spend(4, '生成场景'); return sc;
  };
  const linen = scene('亚麻窗边 场景', '亚麻布', 'cool', '利落安静');
  const wood = scene('旧木书桌 场景', '旧木桌', 'warm', '松弛自然', 2);
  const sea = scene('海边清晨 场景', '海边礁石', 'soft', '开阔透气');
  const chat = { ...PRESET_MODELS[3], id: uid('m'), name: '新模特 1', desc: '卷发、浅笑、米白针织', source: 'chat', temper: ['温柔'] };
  S.models.push(chat); spend(1, '生成模特');
  const studio = (name, sc, modelId, mood) => { const st = { id: uid('w'), name, sceneId: sc.id, modelId, card: { mood }, createdAt: day(22) }; S.studios.push(st); return st; };
  const w1 = studio('亚麻窗边', linen, 'm1', '清冷');
  const w2 = studio('亚麻窗边·小满', linen, 'm2', '温柔'); // 与上一间共用场景
  const w3 = studio('旧木书桌', wood, 'm3', '复古');
  studio('海边清晨', sea, chat.id, '明亮');
  // 一套成片：4 张试戴 + 实物 + 尺寸；verdicts 为每张的「像 / 不像」
  let n = 0;
  const set = (st, pc, at, sceneVersion, verdicts, extra = {}) => {
    const setId = 'demo' + (++n), sc = byId(S.scenes, st.sceneId), m = byId(S.models, st.modelId);
    const snap = { ...sc, version: sceneVersion, light: sceneVersion < sc.version ? 'cool' : sc.light };
    verdicts.forEach((v, i) => S.shots.push({ id: uid('x'), setId, studioId: st.id, pieceId: pc.id, sceneId: sc.id, sceneVersion, sceneSnap: snap, modelId: m.id, modelSnap: { ...m }, kind: 'ai', angle: i % 4, ratio: '1:1', comp: '局部特写', face: DEFAULT_COMP[pc.cat].face, pendantScale: 1, failed: false, verdict: v, retakes: 0, history: [], at, ...(extra[i] || {}) }));
    S.shots.push({ id: uid('x'), setId, studioId: st.id, pieceId: pc.id, kind: 'real', src: 'std', at });
    S.shots.push({ id: uid('x'), setId, studioId: st.id, pieceId: pc.id, kind: 'size', at });
    spend(verdicts.length, '拍摄');
  };
  set(w1, wu, day(22, 15), 1, ['like', 'like', 'like', 'like']);
  // 月白复用亚麻窗边；第 2 张曾被标不像、按「大小」重拍过一次，原图留作历史
  set(w1, yue, day(24, 11), 1, ['like', 'like', null, 'like'], { 1: { retakes: 1, reasons: ['大小'], history: [{ pendantScale: 1.4, at: day(24, 11), reason: '大小' }] } });
  spend(1, '单张重拍');
  set(w2, wu, day(25, 9), 1, ['like', null, 'like', null]);
  // 青梅在旧木书桌拍过两套：场景 v1 时一套，调成暖光（v2）后又拍一套
  set(w3, mei, day(23, 16), 1, ['like', null, 'like', 'like']);
  set(w3, mei, day(26, 14), 2, ['like', 'like', 'like', null]);
  S.refs.push({ id: uid('r'), name: '店铺首页截图 1' });
  S.feedback = S.shots.filter(x => x.verdict).map(x => ({ shotId: x.id, cat: byId(S.pieces, x.pieceId).cat, v: x.verdict, at: x.at }));
  S.matchLog = [{ pieceId: wu.id, path: '新建' }, { pieceId: yue.id, path: '复用', reason: '调性相近' }, { pieceId: mei.id, path: '新建', reason: '风格不同' }];
  console.assert(used() + left() === QUOTA_TOTAL, 'demo quota rows add up');
  return chao;
}
// 清空为新用户；quiet 时不重绘
function resetUser(quiet) {
  Object.assign(S, { user: { shop: '示例店铺', isNew: true }, pieces: [], scenes: [], models: PRESET_MODELS.map(m => ({ ...m, source: 'preset' })), studios: [], shots: [], refs: [], usage: [], followups: [], exportLogs: [], consentLogs: [], feedback: [], matchLog: [] });
  Object.keys(Z).forEach(k => delete Z[k]); F.draft = null; setCounter = 0;
  if (!quiet) { go('home'); toast('已切换到新用户'); }
}
function loadDemo() { seedDemo(); go('home'); toast('已载入示例账号'); }
seedDemo();
